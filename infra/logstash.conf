input {
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  kv {
    source => "message"
    field_split => " "
    value_split => "="
    include_keys => [ "correlationId", "contratoId", "eventId", "eventType", "clienteId", "freelancerId", "status" ]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "freela-logs-%{+YYYY.MM.dd}"
  }
  stdout { codec => rubydebug }
}
